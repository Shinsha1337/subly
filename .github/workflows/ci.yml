name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  subly:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Subly
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: Subly/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build plugin UI
        run: npm run build

      - name: Verify built UI is committed
        run: git diff --exit-code -- dist
